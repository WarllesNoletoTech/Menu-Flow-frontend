<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#221C1A" />
  <title>Menu Flow — sem conexão</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8f5f0;color:#221c1a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,420px);padding:32px;border:1px solid #e7ded5;border-radius:28px;background:#fff;box-shadow:0 20px 60px rgba(50,35,25,.10);text-align:center}.logo{width:88px;height:88px;object-fit:contain;margin-bottom:12px}h1{margin:0;font-size:26px}p{margin:12px 0 24px;color:#74665d;line-height:1.55}.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:0;border-radius:16px;background:#8b2f2f;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/branding/menu-flow-icon-192.png" alt="Menu Flow" />
    <h1>Você está sem conexão</h1>
    <p>Assim que a internet voltar, recarregue o Menu Flow para continuar vendo cardápios e pedidos.</p>
    <button class="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
